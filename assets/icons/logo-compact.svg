<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none" class="aurielle-nav-logo-svg">
  <defs>
    <linearGradient id="navGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#9C772F"/>
    </linearGradient>
    <filter id="navGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Wordmark "Aurielle" in high-contrast serif -->
  <g filter="url(#navGlow)">
    <text x="160" y="44" font-family="'Cormorant Garamond', 'Playfair Display', Didot, 'Bodoni MT', Georgia, serif" font-size="46" font-weight="500" fill="#0B0B0B" text-anchor="middle" letter-spacing="1.5">Aurielle</text>
  </g>

  <!-- Gleaming 4-pointed gold sparkle star positioned directly over 'i' -->
  <path d="M 163.5 5 C 163.5 12, 167 15, 174 15 C 167 15, 163.5 18, 163.5 25 C 163.5 18, 160 15, 153 15 C 160 15, 163.5 12, 163.5 5 Z" fill="url(#navGold)" />

  <!-- Subtitle Tagline -->
  <text x="160" y="62" font-family="'Montserrat', 'Jost', -apple-system, sans-serif" font-size="7" font-weight="600" fill="url(#navGold)" text-anchor="middle" letter-spacing="4.5">TIMELESS BEAUTY &bull; LUXURY WEAR</text>
</svg>
