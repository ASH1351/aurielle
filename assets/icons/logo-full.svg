<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" fill="none" class="aurielle-logo-svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#A57F32"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Wordmark "Aurielle" in high-contrast luxury serif -->
  <g id="brand-wordmark" filter="url(#softShadow)">
    <text x="250" y="112" font-family="'Cormorant Garamond', 'Playfair Display', Didot, 'Bodoni MT', Georgia, serif" font-size="84" font-weight="500" fill="#0B0B0B" text-anchor="middle" letter-spacing="1.5">Aurielle</text>
  </g>

  <!-- Gold 4-pointed sparkle star over 'i' -->
  <path d="M 239 42 C 239 52, 243.5 56, 255 56 C 243.5 56, 239 60, 239 70 C 239 60, 234.5 56, 223 56 C 234.5 56, 239 52, 239 42 Z" fill="url(#goldGradient)" />

  <!-- Tapered Gold Line with Centered Star -->
  <path d="M 130 142 L 234 142" stroke="url(#goldGradient)" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 266 142 L 370 142" stroke="url(#goldGradient)" stroke-width="1.4" stroke-linecap="round" />
  
  <!-- Centered Gold Star Divider -->
  <path d="M 250 132 C 250 138.5, 253.5 142, 260 142 C 253.5 142, 250 145.5, 250 152 C 250 145.5, 246.5 142, 240 142 C 246.5 142, 250 138.5, 250 132 Z" fill="url(#goldGradient)" />

  <!-- TIMELESS BEAUTY in wide-tracked black caps -->
  <text x="250" y="176" font-family="'Montserrat', 'Jost', -apple-system, sans-serif" font-size="15" font-weight="500" fill="#0B0B0B" text-anchor="middle" letter-spacing="7">TIMELESS BEAUTY</text>

  <!-- LUXURY WEAR in wide-tracked gold caps -->
  <text x="250" y="205" font-family="'Montserrat', 'Jost', -apple-system, sans-serif" font-size="13" font-weight="600" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="7">LUXURY WEAR</text>
</svg>
